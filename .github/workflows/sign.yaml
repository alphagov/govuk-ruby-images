name: Sign container images

on:
  workflow_run:
    workflows: ["Build and push ARM images"]
    types:
      - completed
  workflow_dispatch:

jobs:
  configure_builds:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Read configuration from build-matrix.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.set-matrix.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1
          show-progress: false

      - id: set-matrix
        run: echo "versions=$(jq -c '[.version[].rubyver[0:2] | join(".")]' < build-matrix.json)" >> "$GITHUB_OUTPUT"

  sign:
    name: Create attestation
    needs: configure_builds
    runs-on: ubuntu-26.04-arm
    strategy:
      matrix:
        version: ${{ fromJson(needs.configure_builds.outputs.versions) }}
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        id: syft
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: "arn:aws:iam::172025368201:role/github_action_image_attestation"
          role-session-name: sign-govuk-ruby-images
          aws-region: eu-west-1
      - name: Create attestation
        env:
          RUBY_MAJOR: ${{ matrix.version }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          for img in base builder; do
            repo="ghcr.io/alphagov/govuk-ruby-${img}"
            # Resolve the tag once so that the SBOM and the attestation refer to
            # the same image even if the tag moves while this job is running.
            digest=$(docker buildx imagetools inspect "${repo}:${RUBY_MAJOR}" --format '{{json .Manifest}}' | jq -r .digest)
            "$SYFT" --platform linux/arm64 --output spdx-json "${repo}@${digest}" > "${img}.spdx.json"
            cosign attest -y --type spdxjson --predicate "${img}.spdx.json" --key "awskms:///alias/container-signing-key" "${repo}@${digest}"
          done
